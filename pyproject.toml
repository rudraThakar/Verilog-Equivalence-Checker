[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verilog-equivalence-checker"
version = "0.1.0"
description = "BDD-based equivalence checker for combinational Verilog designs"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Digital Logic Assignment Team" }]
license = { text = "MIT" }
dependencies = ["python-sat>=1.8.dev0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
veqcheck = "veqcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
